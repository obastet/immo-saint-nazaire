name: Mise à jour mensuelle DVF
on:
  schedule:
    - cron: "0 6 2 * *"  # le 2 de chaque mois, 6h UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - run: |
          git config user.name "maj-auto"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Mise à jour DVF $(date +%F)" && git push || echo "rien de nouveau"
